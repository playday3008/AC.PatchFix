[Gameplay]
; NoWaitUnsafeEject: Removes the wait before an "unsafe eject" (leaving a wall
; in an uncontrolled situation), making it instant. The game's default wait is
; 1.0s; this patch sets it to 0.
; (Toggle via [Hooks])

; CrouchFix: Makes the crouch/uncrouch button toggle reliably on every press,
; even while sprinting (vanilla can require a second press to cancel a crouch
; queued during a sprint). One-time patch applied at launch.

; EasierTurnWhenSwinging: Raises the priority of the horizontal-swing turn so
; it triggers more readily. One-time patch applied at launch.

; AllowCustomizeEquipment: Lets the equipment-customization UI open while on a
; ledge or peak (vanilla restricts it to a subset of navigation states).
; Mid-hook; toggles live via hot-reload.

; AimFromPeaks: Allows aiming bombs / ranged tools from perches ("peaks").
; DEFAULT OFF: has documented crash edge-cases on slopes and V-shapes (trees,
; flagpoles). Enable only after verifying stability on your build.
; Mid-hook; default off, so set to true and RESTART to enable. Once enabled at
; launch it can then be toggled off/on live.

[Hooks]
; Toggle individual hooks. Accepts: true/false, yes/no, on/off, 1/0
; Byte-patch hooks (NoWaitUnsafeEject, CrouchFix, EasierTurnWhenSwinging) apply
; once at launch: changing them takes effect only on the next game start.
; Mid-hook fixes (AllowCustomizeEquipment, AimFromPeaks) can be toggled OFF live
; via hot-reload; enabling one that was disabled at launch requires a restart.
NoWaitUnsafeEject=true
CrouchFix=true
EasierTurnWhenSwinging=true
AllowCustomizeEquipment=true
AimFromPeaks=false
