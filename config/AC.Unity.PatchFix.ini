[Gameplay]
; NoWaitUnsafeEject: Removes the wait before an "unsafe eject" (leaving a wall
; in an uncontrolled situation), making it instant. The game's default wait is
; 1.0s; this patch sets it to 0.
; (Toggle via [Hooks])

; CrouchFix: Makes the crouch/uncrouch button toggle reliably on every press,
; even while sprinting (vanilla can require a second press to cancel a crouch
; queued during a sprint). One-time patch applied at launch.

; EasierTurnWhenSwinging: Raises the priority of the horizontal-swing turn so
; it triggers more readily. One-time patch applied at launch.

[Hooks]
; Toggle individual hooks. Accepts: true/false, yes/no, on/off, 1/0
; This hook is a one-time patch applied at launch; toggling it takes effect on
; the next game start (not via hot-reload).
NoWaitUnsafeEject=true
CrouchFix=true
EasierTurnWhenSwinging=true
