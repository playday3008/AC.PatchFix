name: Release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      game:
        description: "Game to release (directory under games/)"
        required: true
        type: choice
        options:
          - ac/rogue
          - ac/syndicate
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean

env:
  LLVM_VERSION: '22'
  MSVC_WINE_COMMIT: '514f8ea34842cd6d831804d0e9658d3a32870ae1'

concurrency:
  group: release-${{ inputs.game }}
  cancel-in-progress: false

jobs:
  validate:
    name: Resolve and validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      target: ${{ steps.version.outputs.target }}
      notes_from: ${{ steps.version.outputs.notes_from }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version from the game's CMakeLists.txt
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GAME: ${{ inputs.game }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          CMAKE_FILE="games/$GAME/CMakeLists.txt"
          BASE=$(sed -n '/^project(/,/)/p' "$CMAKE_FILE" \
                 | grep -m1 -oP '^\s*VERSION \K[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$BASE" ]; then
            echo "::error::No project() VERSION found in $CMAKE_FILE. Expected: X.Y.Z"
            exit 1
          fi

          TARGET=${GAME//\//-}
          PREFIX="$TARGET/v"

          if git rev-parse -q --verify "refs/tags/$PREFIX$BASE" >/dev/null; then
            echo "::error::Tag '$PREFIX$BASE' already exists. Bump VERSION in $CMAKE_FILE."
            exit 1
          fi

          # Prereleases are excluded: X.Y.Z-rc1 must not block X.Y.Z. Until a
          # game has a tag of its own, the repo-wide v* tags that bundled every
          # game are its history.
          LATEST_TAG=$(git tag --list "$PREFIX*" | grep -P "^\Q$PREFIX\E[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -1 || true)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          fi
          LATEST=${LATEST_TAG##*v}
          if [ -n "$LATEST" ] \
             && { [ "$BASE" = "$LATEST" ] \
                  || [ "$(printf '%s\n%s\n' "$BASE" "$LATEST" | sort -V | head -1)" != "$LATEST" ]; }; then
            echo "::error::Version '$BASE' is not greater than the latest release '$LATEST_TAG'"
            exit 1
          fi

          # Needs contents:write, otherwise the API hides drafts. Unguarded on
          # purpose: a transient failure must not read as "nothing exists".
          RELEASES=$(gh release list --limit 200 --json tagName --jq '.[].tagName')

          if [ "$PRERELEASE" = "true" ]; then
            # Published tags plus every release, so a cancelled draft rc still
            # advances the counter instead of colliding with itself.
            LAST_RC=$( { git tag --list "$PREFIX$BASE-rc*"; echo "$RELEASES"; } \
                       | grep -oP "^\Q$PREFIX$BASE\E-rc\K[0-9]+$" | sort -n | tail -1 || true)
            VERSION="$BASE-rc$(( ${LAST_RC:-0} + 1 ))"
          else
            VERSION="$BASE"
          fi

          if echo "$RELEASES" | grep -qxF "$PREFIX$VERSION"; then
            echo "::error::Release '$PREFIX$VERSION' already exists (possibly a draft). Delete it or bump VERSION in $CMAKE_FILE."
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=$PREFIX$VERSION"
            echo "target=$TARGET"
            echo "notes_from=$LATEST_TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $PREFIX$VERSION (previous: ${LATEST_TAG:-none})" >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    name: Build (Windows)
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    needs: [validate]
    steps:
      - uses: actions/checkout@v7

      - name: Configure Release
        run: cmake --preset windows-x64-release

      - name: Build Release
        run: cmake --build --preset windows-x64-release --config Release --target ${{ needs.validate.outputs.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PatchFix-windows
          path: build/bin/Release/*.asi
          if-no-files-found: error

  build-wine:
    name: Build (Wine cross-compile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}

      - name: Clone msvc-wine
        run: git clone https://github.com/mstorsjo/msvc-wine.git /tmp/msvc-wine && git -C /tmp/msvc-wine checkout $MSVC_WINE_COMMIT

      - name: Get MSVC version
        id: msvc-version
        run: |
          MSVC_VER=$(/tmp/msvc-wine/vsdownload.py --print-version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' | tail -1)
          echo "version=$MSVC_VER" >> "$GITHUB_OUTPUT"

      - name: Restore msvc-wine cache
        id: msvc-wine-cache
        uses: actions/cache@v6
        with:
          path: ~/.msvc
          key: msvc-wine-${{ steps.msvc-version.outputs.version }}-${{ hashFiles('cmake/toolchains/*.cmake') }}
          restore-keys: msvc-wine-

      - name: Install msvc-wine
        if: steps.msvc-wine-cache.outputs.cache-hit != 'true'
        run: |
          /tmp/msvc-wine/vsdownload.py --accept-license --dest ~/.msvc
          /tmp/msvc-wine/install.sh ~/.msvc

      - name: Configure
        run: cmake --preset wine-x64

      - name: Build Release
        run: cmake --build --preset wine-x64-release --target ${{ needs.validate.outputs.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PatchFix-wine
          path: build/bin/Release/*.asi
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate, build-windows, build-wine]
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: PatchFix-windows
          path: artifacts/windows

      - name: Download Wine artifact
        uses: actions/download-artifact@v8
        with:
          name: PatchFix-wine
          path: artifacts/wine

      - name: Prepare release assets
        run: |
          for asi in artifacts/windows/*.asi; do
            cp "$asi" "$(basename "$asi")"
          done
          for asi in artifacts/wine/*.asi; do
            name="$(basename "$asi" .asi)"
            cp "$asi" "${name}-wine.asi"
          done
          cp "games/${{ inputs.game }}"/*.ini .

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          PREVIOUS: ${{ needs.validate.outputs.notes_from }}
        run: |
          # The default notes would diff against the newest tag of any game.
          ARGS=(-f tag_name="$TAG" -f target_commitish="$GITHUB_SHA")
          if [ -n "$PREVIOUS" ]; then
            ARGS+=(-f previous_tag_name="$PREVIOUS")
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${ARGS[@]}" --jq .body > notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ inputs.prerelease }}
          body_path: notes.md
          files: |
            *.asi
            *.ini
