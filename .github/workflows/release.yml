name: Release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean

env:
  LLVM_VERSION: '22'
  MSVC_WINE_COMMIT: '514f8ea34842cd6d831804d0e9658d3a32870ae1'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Resolve and validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version from CMakeLists.txt
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 -oP '^\s*VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          if [ -z "$VERSION" ]; then
            echo "::error::No project VERSION found in CMakeLists.txt"
            exit 1
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Malformed version '$VERSION' in CMakeLists.txt. Expected: X.Y.Z"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag 'v$VERSION' already exists. Bump VERSION in CMakeLists.txt."
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release 'v$VERSION' already exists (possibly a draft). Bump VERSION in CMakeLists.txt."
            exit 1
          fi

          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -1)
          LATEST=${LATEST#v}
          if [ -n "$LATEST" ]; then
            if [ "$VERSION" = "$LATEST" ] \
               || [ "$(printf '%s\n%s\n' "$VERSION" "$LATEST" | sort -V | head -1)" != "$LATEST" ]; then
              echo "::error::Version '$VERSION' is not greater than the latest release '$LATEST'"
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION (previous: ${LATEST:-none})" >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    name: Build (Windows)
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    needs: [validate]
    steps:
      - uses: actions/checkout@v7

      - name: Configure Release
        run: cmake --preset windows-x64-release

      - name: Build Release
        run: cmake --build --preset windows-x64-release --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AC.PatchFix-windows
          path: build/bin/Release/*.asi
          if-no-files-found: error

  build-wine:
    name: Build (Wine cross-compile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}

      - name: Clone msvc-wine
        run: git clone https://github.com/mstorsjo/msvc-wine.git /tmp/msvc-wine && git -C /tmp/msvc-wine checkout $MSVC_WINE_COMMIT

      - name: Get MSVC version
        id: msvc-version
        run: |
          MSVC_VER=$(/tmp/msvc-wine/vsdownload.py --print-version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' | tail -1)
          echo "version=$MSVC_VER" >> "$GITHUB_OUTPUT"

      - name: Restore msvc-wine cache
        id: msvc-wine-cache
        uses: actions/cache@v6
        with:
          path: ~/.msvc
          key: msvc-wine-${{ steps.msvc-version.outputs.version }}-${{ hashFiles('cmake/toolchains/*.cmake') }}
          restore-keys: msvc-wine-

      - name: Install msvc-wine
        if: steps.msvc-wine-cache.outputs.cache-hit != 'true'
        run: |
          /tmp/msvc-wine/vsdownload.py --accept-license --dest ~/.msvc
          /tmp/msvc-wine/install.sh ~/.msvc

      - name: Configure
        run: cmake --preset wine-x64

      - name: Build Release
        run: cmake --build --preset wine-x64-release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AC.PatchFix-wine
          path: build/bin/Release/*.asi
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate, build-windows, build-wine]
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: AC.PatchFix-windows
          path: artifacts/windows

      - name: Download Wine artifact
        uses: actions/download-artifact@v8
        with:
          name: AC.PatchFix-wine
          path: artifacts/wine

      - name: Prepare release assets
        run: |
          for asi in artifacts/windows/*.asi; do
            cp "$asi" "$(basename "$asi")"
          done
          for asi in artifacts/wine/*.asi; do
            name="$(basename "$asi" .asi)"
            cp "$asi" "${name}-wine.asi"
          done
          cp config/*.ini .

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: v${{ needs.validate.outputs.version }}
          draft: true
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            *.asi
            *.ini
